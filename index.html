/* ==========================================================================

}

  border-top: 3px solid var(--gold);
}

  padding: 54px 0;

}

}

.chips {
  display: flex;
  gap: 10px;

  scrollbar-width: none;
}

.chips::-webkit-scrollbar {
  display: none;
}

.chip {
  flex: none;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  padding: 8px 18px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.chip:hover {
  border-color: var(--rani);
}

.chip[aria-pressed="true"] {
  background: var(--rani);
  border-color: var(--rani);
  color: #FFFFFF;
  box-shadow: 0 4px 12px rgba(179, 23, 79, 0.25);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 22px;
}

.item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.item:hover {
  transform: translateY(-4px);
}

.sw {
  aspect-ratio: 3 / 4;
  position: relative;
  background: linear-gradient(165deg, var(--a), var(--b));
  overflow: hidden;
}

.sw::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, var(--z) 1.6px, transparent 2.4px) 0 0 / 20px 20px;
  opacity: 0.55;
}

.sw::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 26%;
  border-top: 3px solid var(--z);
  background:
    repeating-linear-gradient(90deg, var(--z) 0 2px, transparent 2px 10px),
    linear-gradient(var(--c), var(--c));
}

.sw img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

.info {
  padding: 16px;

  flex-direction: column;

}

.info h3 {

.fab {

.price {

  font-size: 19px;

}

.buy {

  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
  background: var(--wa);
  color: #FFFFFF;
  border-radius: 8px;
  padding: 10px;
  font-weight: 600;
  font-size: 15px;
  transition: background 0.2s ease;
}

.buy:hover {
  background: var(--wa-hover);
}

.item.out {

}

.buy[disabled], .buy.off {

}

footer {
